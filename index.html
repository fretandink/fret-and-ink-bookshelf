,"MEZZANINE","BALCONY","AISLE","ROWS","UPPER","LOWER"]},{"name":"Basement Show","words":["BASEMENT","HOMEMADE","HOUSE","GARAGE","KITCHEN","LIVING","ROOM","FLYER","DOOR","DONATION","ALLAGES","PUNK","HARDCORE","SCREAMO","INDIE","MOSH","MOSHPIT","SWEAT","BEER","KIDS"]},{"name":"Listening Party","words":["LISTEN","HEAR","PLAY","MUSIC","STEREO","FRIENDS","DRINKS","GLOW","VIBES","CHILL","RELAX","ENJOY","DISCUSS","DEBATE","REVIEW","RATE","FAVORITE","BEANBAG","PILLOW","INCENSE"]},{"name":"Afterparty","words":["PARTY","DANCE","CELEBRATE","TOAST","CHEERS","MIDNIGHT","LATE","NIGHT","MORNING","DAWN","TAXI","UBER","AFTER","HOURS","LOUNGE","BEAT","FUNK","DISCO","KARAOKE","SINGALONG"]},{"name":"Rooftop Concert","words":["ROOFTOP","SKYLINE","CITYSCAPE","STARS","MOON","BREEZE","SUMMER","EVENING","TWILIGHT","DUSK","GOLDEN","HOUR","FAIRY","LANTERN","PICNIC","WINE","CHEESE","VIEW","HEIGHTS","TERRACE"]},{"name":"Acoustic","words":["ACOUSTIC","FINGERPICK","STRUM","HARMONY","MELODY","SOFT","GENTLE","QUIET","INTIMATE","CANDLELIT","STOOL","FOLK","BLUES","COUNTRY","SINGER","SONGWRITER","LYRICS","POETRY","WOOD","NYLON"]},{"name":"Crowd","words":["FANS","AUDIENCE","HANDS","VOICES","SING","JUMP","POGO","SURF","SURFER","LIFT","CARRY","HOLD","SUPPORT","ENERGY","LOUD","WILD","CRAZY","ELECTRIC","ALIVE","UNITED"]},{"name":"Artist Names","words":["NESSA","TALLY","PARIS","SUSANNAH","LORELEI","BAILEY","MICHELLE","TAYLOR","BILLIE","OLIVIA","ARIANA","ADELE","BEYONCE","RIHANNA","SELENA","LIZZO","HALSEY","LORDE","STEVIE","MADONNA"]},{"name":"Song Titles","words":["YESTERDAY","IMAGINE","HELLO","HALO","FIREWORK","ROAR","HERO","THRILLER","BELIEVE","TOXIC","HAPPY","BRAVE","STRONGER","FIGHTER","BEAUTIFUL","DIAMONDS","GOLD","ANGEL","DREAMS","MAGIC"]},{"name":"Genres","words":["ROCK","METAL","JAZZ","SOUL","REGGAE","SKAPUNK","GRUNGE","SHOEGAZE","DREAMPOP","SYNTHPOP","ELECTROPOP","HYPERPOP","ALTERNATIVE","PROG","PROGRESSIVE","PSYCHEDELIC","AMBIENT","HIPHOP","TRAP","TECHNO"]}]};

      var TOTAL_THEMES = DATA.themes.length; // 30
      var WORDS_PER_THEME = 20;

      /* ---------- Helpers ---------- */
      function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      }
      function scrambleWord(word) {
        if (word.length < 2) return word;
        var out = word;
        var guard = 0;
        while (out === word && guard < 60) {
          out = shuffle(word.split("")).join("");
          guard++;
        }
        return out;
      }
      function $(id) { return document.getElementById(id); }

      /* ---------- State ---------- */
      var completed = {}; // themeIndex -> true
      var game = null;    // active game state

      /* ---------- Screens ---------- */
      function show(screenId) {
        ["pickerScreen", "gameScreen", "resultsScreen"].forEach(function (id) {
          $(id).classList.toggle("hidden", id !== screenId);
        });
        window.scrollTo(0, 0);
      }

      /* ---------- Picker ---------- */
      function renderPicker() {
        var grid = $("themeGrid");
        grid.innerHTML = "";
        DATA.themes.forEach(function (theme, idx) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "theme-btn" + (completed[idx] ? " done" : "");
          var check = document.createElement("span");
          check.className = "check";
          check.textContent = "✓";
          check.setAttribute("aria-hidden", "true");
          var label = document.createElement("span");
          label.textContent = theme.name;
          btn.appendChild(check);
          btn.appendChild(label);
          if (completed[idx]) btn.setAttribute("aria-label", theme.name + " (completed)");
          btn.addEventListener("click", function () { startTheme(idx); });
          grid.appendChild(btn);
        });
        var cleared = Object.keys(completed).length;
        $("clearedCount").textContent = "Themes cleared: " + cleared + " of " + TOTAL_THEMES;
        $("clearedBarFill").style.width = (cleared / TOTAL_THEMES * 100) + "%";
      }

      /* ---------- Game flow ---------- */
      function startTheme(idx) {
        var theme = DATA.themes[idx];
        game = {
          themeIndex: idx,
          themeName: theme.name,
          order: shuffle(theme.words),
          pos: 0,
          score: 0,
          solved: 0,
          skipped: 0,
          streak: 0,
          bestStreak: 0,
          hintsUsed: 0,
          revealed: [],
          answer: "",
          scrambled: "",
          locked: false
        };
        show("gameScreen");
        loadWord();
      }

      function wordValue() {
        return Math.max(20, 100 - game.hintsUsed * 10);
      }

      function loadWord() {
        game.answer = game.order[game.pos];
        game.scrambled = scrambleWord(game.answer);
        game.hintsUsed = 0;
        game.revealed = [];
        for (var i = 0; i < game.answer.length; i++) game.revealed.push(false);
        game.locked = false;
        renderGame();
        setFeedback("", "");
        var input = $("guessInput");
        input.value = "";
        input.disabled = false;
        $("submitBtn").disabled = false;
        $("hintBtn").disabled = false;
        $("skipBtn").disabled = false;
        input.focus();
      }

      function renderGame() {
        $("hudTheme").textContent = game.themeName;
        $("hudWord").textContent = (game.pos + 1) + " of " + WORDS_PER_THEME;
        $("hudScore").textContent = game.score;
        $("hudStreak").textContent = game.streak;
        $("hudSolved").textContent = game.solved + " of " + WORDS_PER_THEME;

        var tiles = $("tiles");
        tiles.innerHTML = "";
        game.scrambled.split("").forEach(function (ch) {
          var t = document.createElement("span");
          t.className = "tile";
          t.textContent = ch;
          tiles.appendChild(t);
        });

        renderSlots();
        updateHintLine();
      }

      function renderSlots() {
        var slots = $("answerSlots");
        slots.innerHTML = "";
        for (var i = 0; i < game.answer.length; i++) {
          var s = document.createElement("span");
          s.className = "slot" + (game.revealed[i] ? " revealed" : "");
          if (game.revealed[i]) {
            s.textContent = game.answer[i];
          } else {
            var b = document.createElement("span");
            b.className = "blank";
            b.textContent = "_";
            s.appendChild(b);
          }
          slots.appendChild(s);
        }
      }

      function updateHintLine() {
        var left = game.answer.length - game.revealed.filter(Boolean).length;
        if (game.hintsUsed === 0) {
          $("hintLine").innerHTML = "This word is worth <b>100 points</b>. Each hint costs 10.";
        } else {
          $("hintLine").innerHTML = "Hints used: <b>" + game.hintsUsed + "</b> — this word is now worth <b>" +
            wordValue() + " points</b>. " + left + " letter" + (left === 1 ? "" : "s") + " still hidden.";
        }
      }

      function setFeedback(text, cls) {
        var fb = $("feedback");
        fb.textContent = text;
        fb.className = "feedback" + (cls ? " " + cls : "");
      }

      function advance() {
        game.pos++;
        if (game.pos >= WORDS_PER_THEME) {
          finishTheme();
        } else {
          loadWord();
        }
      }

      function onSubmit(ev) {
        ev.preventDefault();
        if (!game || game.locked) return;
        var guess = $("guessInput").value.trim().toUpperCase();
        if (!guess) return;
        if (guess === game.answer) {
          var pts = wordValue();
          game.score += pts;
          game.solved++;
          game.streak++;
          if (game.streak > game.bestStreak) game.bestStreak = game.streak;
          game.locked = true;
          $("guessInput").disabled = true;
          $("submitBtn").disabled = true;
          $("hintBtn").disabled = true;
          $("skipBtn").disabled = true;
          // Reveal the full word in the slots as confirmation.
          for (var i = 0; i < game.answer.length; i++) game.revealed[i] = true;
          renderGame();
          setFeedback("Correct! +" + pts + " points", "good");
          setTimeout(advance, 1000);
        } else {
          game.streak = 0;
          $("hudStreak").textContent = "0";
          setFeedback("Not quite — try again", "bad");
          $("guessInput").value = "";
          $("guessInput").focus();
        }
      }

      function onHint() {
        if (!game || game.locked) return;
        for (var i = 0; i < game.answer.length; i++) {
          if (!game.revealed[i]) {
            game.revealed[i] = true;
            game.hintsUsed++;
            break;
          }
        }
        renderSlots();
        updateHintLine();
        $("guessInput").focus();
      }

      function onSkip() {
        if (!game || game.locked) return;
        game.skipped++;
        game.streak = 0;
        advance();
      }

      function finishTheme() {
        completed[game.themeIndex] = true;
        $("resultsTitle").textContent = game.themeName + " — Complete!";
        $("resultsNote").textContent = game.solved === WORDS_PER_THEME
          ? "A perfect run — every word unscrambled."
          : "Theme cleared and checked off in the picker.";
        $("resScore").textContent = game.score;
        $("resSolved").textContent = game.solved + " / " + WORDS_PER_THEME;
        $("resSkipped").textContent = game.skipped;
        $("resStreak").textContent = game.bestStreak;
        show("resultsScreen");
      }

      /* ---------- Wire up ---------- */
      $("guessForm").addEventListener("submit", onSubmit);
      $("hintBtn").addEventListener("click", onHint);
      $("skipBtn").addEventListener("click", onSkip);
      $("quitBtn").addEventListener("click", function () {
        game = null;
        renderPicker();
        show("pickerScreen");
      });
      $("playAgainBtn").addEventListener("click", function () {
        if (game) startTheme(game.themeIndex);
      });
      $("backBtn").addEventListener("click", function () {
        game = null;
        renderPicker();
        show("pickerScreen");
      });

      renderPicker();
      show("pickerScreen");
    
};
</script>

<script>
(function () {
  // Games live in THIS document now (no iframes): each game's markup, scoped
  // CSS and JS sit inert in a <template> until first tap, then mount into the
  // shared modal and run against a document/window facade rooted at the
  // game's own container, so duplicate IDs/classes across games cannot clash.
  var modal = document.getElementById('gameModal');
  var mount = document.getElementById('gameMount');
  modal.style.display = 'none';
  modal.classList.remove('open');
  var mounted = {};
  function makeBoot(root) {
    var docFacade = {
      getElementById: function (id) { return root.querySelector('[id="' + id + '"]'); },
      querySelector: function (s) { return root.querySelector(s); },
      querySelectorAll: function (s) { return root.querySelectorAll(s); },
      createElement: function (t) { return document.createElement(t); },
      createTextNode: function (t) { return document.createTextNode(t); },
      elementFromPoint: function (x, y) { return document.elementFromPoint(x, y); },
      addEventListener: function () { return document.addEventListener.apply(document, arguments); },
      removeEventListener: function () { return document.removeEventListener.apply(document, arguments); },
      body: document.body,
      documentElement: root
    };
    var winFacade = new Proxy(window, {
      get: function (target, prop) {
        if (prop === 'scrollTo') {
          return function () {
            var a = arguments;
            if (a.length && a[0] && typeof a[0] === 'object') {
              root.scrollTo({ top: a[0].top || 0, left: a[0].left || 0, behavior: a[0].behavior || 'auto' });
            } else {
              root.scrollTo(a[0] || 0, a[1] || 0);
            }
          };
        }
        if (prop === 'scrollY') return root.scrollTop;
        if (prop === 'scrollX') return root.scrollLeft;
        var v = target[prop];
        return typeof v === 'function' ? v.bind(target) : v;
      },
      set: function (target, prop, value) { target[prop] = value; return true; }
    });
    return { document: docFacade, window: winFacade };
  }
  function openGame(key, label) {
    var holder = mounted[key];
    if (!holder) {
      var tpl = document.getElementById('tpl-' + key);
      if (!tpl || !tpl.content) return;
      holder = document.createElement('div');
      holder.className = 'game-holder';
      holder.appendChild(document.importNode(tpl.content, true));
      mount.appendChild(holder);
      mounted[key] = holder;
      var root = holder.querySelector('.game-root');
      var boot = makeBoot(root);
      var fn = window.__games && window.__games[key];
      if (fn) fn.call(boot.window, boot.document, boot.window);
    }
    for (var k in mounted) {
      if (mounted.hasOwnProperty(k)) mounted[k].style.display = (k === key) ? 'block' : 'none';
    }
    if (label) modal.setAttribute('aria-label', label);
    modal.style.display = 'block';
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeGame() {
    modal.style.display = 'none';
    modal.classList.remove('open');
    document.body.style.overflow = '';
  }
  // The WHOLE hover zone is the tap target, not just the dot.
  var zones = document.querySelectorAll('.hotzone');
  for (var j = 0; j < zones.length; j++) {
    (function (zone) {
      zone.addEventListener('click', function () {
        var btn = zone.querySelector('[data-modal]');
        if (btn) openGame(btn.getAttribute('data-modal'), btn.getAttribute('aria-label'));
      });
    })(zones[j]);
  }
  var closers = modal.querySelectorAll('[data-close]');
  for (var c = 0; c < closers.length; c++) {
    closers[c].addEventListener('click', closeGame);
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modal.classList.contains('open')) closeGame();
  });
})();
</script>
