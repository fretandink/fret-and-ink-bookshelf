<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000 !important; }
  .shelf {
    position: relative;
    width: 100%;
    aspect-ratio: 1741 / 1262;
    background: #000;
    overflow: hidden;
  }
  .shelf img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  /* Pure-black bars covering the white bands baked into the image edges */
  .edge-bar { position: absolute; left: 0; width: 100%; background: #000; pointer-events: none; z-index: 1; }
  .edge-top { top: 0; height: 1.27%; }
  .edge-bottom { bottom: 0; height: 1.99%; }
  .edge-left { left: 0; top: 0; width: 1.0%; height: 100%; }
  .edge-right { left: auto; right: 0; top: 0; width: 1.0%; height: 100%; }
  /* Hover zones: transparent hit areas over each book spine / game box.
     The pink dot is hidden until its book is hovered (green-room style). */
  .hotzone { position: absolute; transform: translate(-50%, -50%); z-index: 2; cursor: pointer; touch-action: manipulation; }
  .hotzone .hotspot { left: 50%; top: 50%; }
  .hotspot {
    position: absolute;
    display: block;
    /* NOTE: % width resolves against the hotzone, NOT the shelf. The zone is
       --zw % of the shelf wide, so 210% / --zw == 2.1% of the shelf (~36px).
       A plain 2.1% here made 4px dots nobody could tap. */
    width: calc(210% / var(--zw, 8));
    aspect-ratio: 1 / 1;
    transform: translate(-50%, -50%);
    /* The dot's PAINT is transparent until hover (green-room style: nothing
       shows on the shelf), but the button itself stays opacity:1 — an
       opacity:0 control is unreachable for touch/keyboard tooling even
       though the zone around it takes the tap. Same look, operable button. */
    background: transparent;
    border: 2px solid transparent;
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
    box-shadow: none;
    font-family: Arial, Helvetica, sans-serif;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .25s ease, border-color .25s ease, transform .15s ease, box-shadow .15s ease;
    z-index: 2;
  }
  .hotzone:hover .hotspot,
  .hotspot:focus-visible {
    background: #FF0175;
    border-color: #fff;
    box-shadow: 0 0 0 2px rgba(255,1,117,.35), 0 0 14px 2px rgba(255,1,117,.45);
  }
  .hotspot .pill {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 10px);
    transform: translateX(-50%) translateY(4px);
    white-space: nowrap;
    background: #000;
    color: #FF0175;
    border: 2px solid #FF0175;
    font-weight: 700;
    font-size: clamp(10px, 1.15vw, 15px);
    line-height: 1;
    padding: 8px 12px;
    border-radius: 999px;
    box-shadow: 0 2px 10px rgba(0,0,0,.45), 0 0 14px rgba(255,1,117,.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
    z-index: 3;
  }
  .hotzone:hover .pill,
  .hotspot:hover .pill,
  .hotspot:focus-visible .pill,
  .hotspot:active .pill {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .hotspot:hover, .hotspot:focus-visible, .hotspot:active {
    outline: none;
    transform: translate(-50%, -50%) scale(1.25);
    box-shadow: 0 0 0 3px #FF0175, 0 0 22px 6px rgba(255,1,117,.6);
  }
  /* ---- Game modals: ALWAYS start hidden. Shown only by openModal(). ---- */
  .modal { position: fixed; inset: 0; z-index: 100; display: none; }
  .modal.open { display: block; }
  .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.88); cursor: pointer; }
  .modal-box {
    position: absolute; inset: 2.5%;
    background: #000; border: 2px solid #FF0175; border-radius: 14px;
    overflow: hidden; box-shadow: 0 0 40px rgba(255,1,117,.35);
  }
  .modal-close {
    position: absolute; top: 10px; right: 10px; z-index: 2;
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid #fff; background: #FF0175; color: #fff;
    font-size: 22px; line-height: 1; font-weight: 700; cursor: pointer;
    box-shadow: 0 2px 12px rgba(0,0,0,.5);
  }
  .modal-close:hover { transform: scale(1.08); }

  /* ---- In-page games (no iframes) ---- */
  #gameMount { position: absolute; inset: 0; }
  .game-holder { height: 100%; }
  .game-root { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  /* Right-edge books: keep the name pill inside the screen */
  .hotzone.pill-in .hotspot .pill { left: auto; right: -10px; transform: translateY(4px); }
  .hotzone.pill-in:hover .pill,
  .hotzone.pill-in .hotspot:focus-visible .pill,
  .hotzone.pill-in .hotspot:active .pill { transform: translateY(0); }
</style>

        b.querySelector(".txt").textContent = w.clue;
        b.addEventListener("click", function(){ selectWord(w, true); });
        w.el = b;
        li.appendChild(b); ul.appendChild(li);
      });
  }

  function activeWord(){
    if(!isWhite(selected.r, selected.c)) return null;
    var cw = cellWords[selected.r][selected.c];
    return cw[direction] || cw[direction === "A" ? "D" : "A"] || null;
  }
  function ensureDirection(){
    var cw = cellWords[selected.r] && cellWords[selected.r][selected.c];
    if(cw && !cw[direction] && cw[direction === "A" ? "D" : "A"]) direction = direction === "A" ? "D" : "A";
  }

  function render(){
    ensureDirection();
    var aw = activeWord();
    var inWord = {};
    if(aw) aw.cells.forEach(function(cell){ inWord[cell[0] + "," + cell[1]] = true; });
    Object.keys(cellEls).forEach(function(key){
      var el = cellEls[key];
      el.classList.toggle("in-word", !!inWord[key]);
      el.classList.toggle("selected", key === selected.r + "," + selected.c);
      el.classList.toggle("wrong", !!wrongSet[key]);
      el.classList.toggle("checked-ok", !!okSet[key] && !wrongSet[key]);
    });
    if(aw){
      document.getElementById("nowDir").textContent = aw.n + (aw.dir === "A" ? " Across" : " Down");
      document.getElementById("nowText").textContent = aw.clue;
    }
    WORDS.forEach(function(w){
      if(!w.el) return;
      var isActive = aw && w.n === aw.n && w.dir === aw.dir;
      w.el.classList.toggle("active", !!isActive);
      var solved = w.cells.every(function(cell){ return values[cell[0]][cell[1]] === solution[cell[0]][cell[1]]; });
      w.el.classList.toggle("solved", solved);
    });
    updateProgress();
  }

  function updateProgress(){
    var totalCells = 0, filled = 0, solvedWords = 0;
    for(var rr = 0; rr < ROWS; rr++) for(var cc = 0; cc < COLS; cc++){
      if(solution[rr][cc] !== null){ totalCells++; if(values[rr][cc]) filled++; }
    }
    WORDS.forEach(function(w){
      if(w.cells.every(function(cell){ return values[cell[0]][cell[1]] === solution[cell[0]][cell[1]]; })) solvedWords++;
    });
    document.getElementById("wordsDone").textContent = solvedWords;
    document.getElementById("pctDone").textContent = totalCells ? Math.round(filled / totalCells * 100) + "%" : "0%";
  }

  function isComplete(){
    for(var rr = 0; rr < ROWS; rr++) for(var cc = 0; cc < COLS; cc++){
      if(solution[rr][cc] !== null && values[rr][cc] !== solution[rr][cc]) return false;
    }
    return true;
  }
  function afterChange(){
    render();
    if(isComplete()){
      if(!completed[currentIndex]){ completed[currentIndex] = true; refreshPicker(); }
      document.getElementById("congrats").classList.add("show");
      setFeedback("Puzzle complete — nice work!", "good");
    } else {
      document.getElementById("congrats").classList.remove("show");
    }
  }
  function setFeedback(msg, kind){
    var f = document.getElementById("feedback");
    f.textContent = msg || "";
    f.className = "feedback" + (kind ? " " + kind : "");
  }

  function focusCell(r, c){
    var inp = inputs[r + "," + c];
    if(inp){ inp.focus({preventScroll: false}); try{ inp.setSelectionRange(1, 1); }catch(e){} }
  }
  function selectCell(r, c, focus){
    if(!isWhite(r, c)) return;
    selected = {r: r, c: c};
    ensureDirection();
    render();
    if(focus) focusCell(r, c);
  }
  function selectWord(w, focus){
    direction = w.dir;
    selected = {r: w.row, c: w.col};
    render();
    if(focus) focusCell(w.row, w.col);
  }
  function move(dr, dc){
    var nr = selected.r + dr, nc = selected.c + dc;
    while(nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !isWhite(nr, nc)){ nr += dr; nc += dc; }
    if(nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && isWhite(nr, nc)){
      if(dr !== 0) direction = cellWords[nr][nc].D ? "D" : "A";
      if(dc !== 0) direction = cellWords[nr][nc].A ? "A" : "D";
      selected = {r: nr, c: nc};
      render(); focusCell(nr, nc);
    }
  }
  function stepInWord(delta){
    var aw = activeWord(); if(!aw) return;
    var idx = -1;
    for(var k = 0; k < aw.cells.length; k++){ if(aw.cells[k][0] === selected.r && aw.cells[k][1] === selected.c) idx = k; }
    var nxt = idx + delta;
    if(nxt >= 0 && nxt < aw.cells.length){
      selected = {r: aw.cells[nxt][0], c: aw.cells[nxt][1]};
      render(); focusCell(selected.r, selected.c);
    }
  }
  function toggleDirection(){
    var cw = cellWords[selected.r][selected.c];
    if(cw && cw.A && cw.D){ direction = direction === "A" ? "D" : "A"; render(); focusCell(selected.r, selected.c); }
  }

  function attachInput(inp){
    var wasSelectedOnPointerDown = false;
    inp.addEventListener("pointerdown", function(){
      wasSelectedOnPointerDown = (selected.r === +inp.dataset.r && selected.c === +inp.dataset.c);
    });
    inp.addEventListener("click", function(){
      var rr = +inp.dataset.r, cc = +inp.dataset.c;
      if(wasSelectedOnPointerDown && selected.r === rr && selected.c === cc) toggleDirection();
    });
    inp.addEventListener("focus", function(){
      selectCell(+inp.dataset.r, +inp.dataset.c, false);
    });
    inp.addEventListener("input", function(){
      var rr = +inp.dataset.r, cc = +inp.dataset.c;
      var v = (inp.value || "").toUpperCase().replace(/[^A-Z]/g, "");
      v = v ? v[v.length - 1] : "";
      values[rr][cc] = v;
      inp.value = v;
      delete wrongSet[rr + "," + cc]; delete okSet[rr + "," + cc];
      setFeedback("");
      if(v){ stepInWord(1); afterChange(); }
      else render();
    });
    inp.addEventListener("keydown", function(e){
      var rr = +inp.dataset.r, cc = +inp.dataset.c;
      if(e.key === "ArrowRight"){ e.preventDefault(); move(0, 1); }
      else if(e.key === "ArrowLeft"){ e.preventDefault(); move(0, -1); }
      else if(e.key === "ArrowDown"){ e.preventDefault(); move(1, 0); }
      else if(e.key === "ArrowUp"){ e.preventDefault(); move(-1, 0); }
      else if(e.key === "Backspace"){
        e.preventDefault();
        if(values[rr][cc]){ values[rr][cc] = ""; inp.value = ""; delete wrongSet[rr + "," + cc]; delete okSet[rr + "," + cc]; setFeedback(""); afterChange(); }
        else stepInWord(-1);
      }
      else if(e.key === "Delete"){
        e.preventDefault();
        values[rr][cc] = ""; inp.value = ""; delete wrongSet[rr + "," + cc]; delete okSet[rr + "," + cc]; setFeedback(""); afterChange();
      }
      else if(e.key === " " || e.key === "Enter"){ e.preventDefault(); toggleDirection(); }
      else if(/^[a-zA-Z]$/.test(e.key)){
        try{ inp.setSelectionRange(0, 1); }catch(err){}
      }
    });
  }

  function loadPuzzle(index, focusFirst, scrollToBoard){
    currentIndex = ((index % TOTAL) + TOTAL) % TOTAL;
    var puzzle = window.CrosswordLibrary.getPuzzle(currentIndex);
    var numbers = buildState(puzzle);
    buildGrid(numbers);
    buildClues("acrossList", "A");
    buildClues("downList", "D");
    wrongSet = {}; okSet = {};
    document.getElementById("puzzleCounter").textContent = "Puzzle " + (currentIndex + 1) + " of " + TOTAL;
    document.getElementById("puzzleTitleNum").textContent = "#" + (currentIndex + 1);
    document.getElementById("puzzleTitle").textContent = puzzle.title;
    document.getElementById("wordsTotal").textContent = WORDS.length;
    pickerEl.value = String(currentIndex);
    document.getElementById("nextPuzzleCongratsBtn").innerHTML =
      currentIndex < TOTAL - 1 ? "Next Puzzle &rarr;" : "Back to Puzzle 1 &rarr;";
    document.getElementById("congratsText").innerHTML =
      currentIndex < TOTAL - 1
        ? "Puzzle complete — every word, note perfect.<br>Ready for Puzzle " + (currentIndex + 2) + "?"
        : "Puzzle complete — that's all 100!<br>Encore? Head back to Puzzle 1.";
    document.getElementById("congrats").classList.remove("show");
    setFeedback("");
    var first = WORDS[0];
    direction = first.dir;
    selected = {r: first.row, c: first.col};
    render();
    if(scrollToBoard) boardCard.scrollIntoView({block: "start"});
    if(focusFirst) focusCell(first.row, first.col);
  }

  document.getElementById("nowClue").addEventListener("click", function(){ toggleDirection(); });

  document.getElementById("checkBtn").addEventListener("click", function(){
    wrongSet = {}; okSet = {};
    var wrong = 0, checked = 0;
    for(var rr = 0; rr < ROWS; rr++) for(var cc = 0; cc < COLS; cc++){
      if(solution[rr][cc] !== null && values[rr][cc]){
        checked++;
        if(values[rr][cc] !== solution[rr][cc]){ wrongSet[rr + "," + cc] = true; wrong++; }
        else okSet[rr + "," + cc] = true;
      }
    }
    render();
    if(isComplete()){ afterChange(); }
    else if(checked === 0) setFeedback("Nothing to check yet — fill in some letters first.", "bad");
    else if(wrong === 0) setFeedback("Looking good — no mistakes in the letters you've filled in.", "good");
    else setFeedback(wrong + (wrong === 1 ? " letter is" : " letters are") + " wrong — they're marked in red.", "bad");
  });

  document.getElementById("revealBtn").addEventListener("click", function(){
    for(var rr = 0; rr < ROWS; rr++) for(var cc = 0; cc < COLS; cc++){
      if(solution[rr][cc] !== null){ values[rr][cc] = solution[rr][cc]; inputs[rr + "," + cc].value = solution[rr][cc]; }
    }
    wrongSet = {}; okSet = {};
    setFeedback("");
    afterChange();
  });

  function clearAll(){
    for(var rr = 0; rr < ROWS; rr++) for(var cc = 0; cc < COLS; cc++){
      if(solution[rr][cc] !== null){ values[rr][cc] = ""; inputs[rr + "," + cc].value = ""; }
    }
    wrongSet = {}; okSet = {};
    document.getElementById("congrats").classList.remove("show");
    setFeedback("");
    render();
  }
  document.getElementById("clearBtn").addEventListener("click", function(){ clearAll(); focusCell(selected.r, selected.c); });
  document.getElementById("againBtn").addEventListener("click", function(){
    clearAll();
    selectWord(WORDS[0], true);
    boardCard.scrollIntoView({block: "start"});
  });

  /* Puzzle navigation */
  pickerEl.addEventListener("change", function(){ loadPuzzle(+pickerEl.value, true, true); });
  document.getElementById("shuffleBtn").addEventListener("click", function(){
    var n = currentIndex;
    while(n === currentIndex) n = Math.floor(Math.random() * TOTAL);
    loadPuzzle(n, true, true);
  });
  document.getElementById("prevPuzzleBtn").addEventListener("click", function(){ loadPuzzle(currentIndex - 1, true, true); });
  document.getElementById("nextPuzzleBtn").addEventListener("click", function(){ loadPuzzle(currentIndex + 1, true, true); });
  document.getElementById("nextPuzzleCongratsBtn").addEventListener("click", function(){ loadPuzzle(currentIndex + 1, true, true); });

  loadPuzzle(0, false, false);
})();

};
</script>

      var t = Math.imul(a ^ a >>> 15, 1 | a);

      var best = null, bestScore = -1;
      for(var t = 0; t < 400; t++){

        var sr = Math.floor(rng() * SIZE), sc = Math.floor(rng() * SIZE);

      if(!best || built.words.length > best.words.length) best = built;
      if(built.words.length >= TARGET) break;

(function(){
  "use strict";
  var TOTAL = window.WordSearchLibrary.total;

  var puzzle = null;
  var found = {};
  var completed = {}; // puzzle index -> true, this session only
  var currentIndex = 0;
  var cellEls = {};
  var anchor = null;
  var dragging = false, dragMoved = false;
  var dragStart = null, dragCells = null;

  var gridEl = document.getElementById("grid");
  var boardCard = document.getElementById("boardCard");
  var pickerEl = document.getElementById("puzzlePicker");

  for(var pi = 0; pi < TOTAL; pi++){
    var opt = document.createElement("option");
    opt.value = pi;
    opt.textContent = "Puzzle " + (pi + 1);
    pickerEl.appendChild(opt);
  }
  function refreshPicker(){
    for(var i = 0; i < TOTAL; i++){
      pickerEl.options[i].textContent = "Puzzle " + (i + 1) + (completed[i] ? " \u2713" : "");
    }
  }

  function setFeedback(msg, kind){
    var f = document.getElementById("feedback");
    f.textContent = msg || "";
    f.className = "feedback" + (kind ? " " + kind : "");
  }

  function lineCells(r0, c0, r1, c1){
    var dr = r1 > r0 ? 1 : (r1 < r0 ? -1 : 0);
    var dc = c1 > c0 ? 1 : (c1 < c0 ? -1 : 0);
    if(dr !== 0 && dc !== 0 && Math.abs(r1 - r0) !== Math.abs(c1 - c0)) return null;
    var steps = Math.max(Math.abs(r1 - r0), Math.abs(c1 - c0));
    var cells = [];
    for(var k = 0; k <= steps; k++) cells.push([r0 + dr * k, c0 + dc * k]);
    return cells;
  }
  function stringFor(cells){
    return cells.map(function(cell){ return puzzle.grid[cell[0]][cell[1]]; }).join("");
  }
  function clearSelectionHighlight(){
    Object.keys(cellEls).forEach(function(key){ cellEls[key].classList.remove("selecting"); });
  }
  function paintSelecting(cells){
    clearSelectionHighlight();
    cells.forEach(function(cell){
      var el = cellEls[cell[0] + "," + cell[1]];
      if(el) el.classList.add("selecting");
    });
  }
  function clearAnchor(){
    if(anchor){
      var el = cellEls[anchor.r + "," + anchor.c];
      if(el) el.classList.remove("anchor");
    }
    anchor = null;
  }

  function markFound(w, cells){
    found[w.word] = true;
    cells.forEach(function(cell){
      var el = cellEls[cell[0] + "," + cell[1]];
      if(el) el.classList.add("found");
    });
    if(w.el) w.el.classList.add("found");
    updateProgress();
  }
  function checkSelection(cells){
    if(!cells || cells.length < 3) return false;
    var str = stringFor(cells);
    var rev = str.split("").reverse().join("");
    for(var i = 0; i < puzzle.words.length; i++){
      var w = puzzle.words[i];
      if(found[w.word]) continue;
      if(w.word === str || w.word === rev){
        markFound(w, cells);
        setFeedback("Found " + w.word + "!", "good");
        return true;
      }
    }
    return false;
  }

  function updateProgress(){
    var done = 0;
    puzzle.words.forEach(function(w){ if(found[w.word]) done++; });
    document.getElementById("wordsDone").textContent = done;
    document.getElementById("wordsTotal").textContent = puzzle.words.length;
    if(done === puzzle.words.length && puzzle.words.length > 0){
      if(!completed[currentIndex]){ completed[currentIndex] = true; refreshPicker(); }
      document.getElementById("congrats").classList.add("show");
    } else {
      document.getElementById("congrats").classList.remove("show");
    }
  }

  function handleTap(r, c){
    if(anchor && anchor.r === r && anchor.c === c){
      clearAnchor(); setFeedback("", ""); return;
    }
    if(!anchor){
      anchor = {r: r, c: c};
      var el = cellEls[r + "," + c];
      if(el) el.classList.add("anchor");
      setFeedback("Marked a square — now tap the last letter of the word.", "");
      return;
    }
    var line = lineCells(anchor.r, anchor.c, r, c);
    if(!line){
      clearAnchor();
      anchor = {r: r, c: c};
      var el2 = cellEls[r + "," + c];
      if(el2) el2.classList.add("anchor");
      setFeedback("Words run in a straight line — across, down, or diagonal.", "bad");
      return;
    }
    var ok = checkSelection(line);
    clearAnchor();
    if(!ok) setFeedback("That line is not one of the hidden words — try again.", "bad");
  }

  function cellFromPoint(x, y){
    var el = document.elementFromPoint(x, y);
    if(!el) return null;
    var cell = el.closest ? el.closest(".cell") : null;
    if(!cell) return null;
    return {r: +cell.dataset.r, c: +cell.dataset.c};
  }

  function onCellPointerDown(e){
    var r = +e.currentTarget.dataset.r, c = +e.currentTarget.dataset.c;
    dragging = true; dragMoved = false;
    dragStart = {r: r, c: c};
    dragCells = [[r, c]];
    try{ gridEl.setPointerCapture(e.pointerId); }catch(err){}
    paintSelecting(dragCells);
  }
  function onGridPointerMove(e){
    if(!dragging || !dragStart) return;
    var pos = cellFromPoint(e.clientX, e.clientY);
    if(!pos) return;
    if(pos.r === dragStart.r && pos.c === dragStart.c){
      dragCells = [[pos.r, pos.c]];
      paintSelecting(dragCells);
      return;
    }
    var line = lineCells(dragStart.r, dragStart.c, pos.r, pos.c);
    if(!line) return;
    if(!dragMoved){ dragMoved = true; clearAnchor(); }
    dragCells = line;
    paintSelecting(dragCells);
  }
  function onGridPointerUp(e){
    if(!dragging) return;
    dragging = false;
    clearSelectionHighlight();
    if(dragMoved && dragCells && dragCells.length > 1){
      var ok = checkSelection(dragCells);
      clearAnchor();
      if(!ok) setFeedback("That line is not one of the hidden words — try again.", "bad");
    } else {
      var pos = cellFromPoint(e.clientX, e.clientY);
      if(pos) handleTap(pos.r, pos.c);
    }
    dragCells = null; dragStart = null;
  }
  function onGridPointerCancel(){
    dragging = false; dragMoved = false;
    dragCells = null; dragStart = null;
    clearSelectionHighlight();
  }

  function focusCell(r, c){
    if(r < 0 || r >= puzzle.rows || c < 0 || c >= puzzle.cols) return;
    var el = cellEls[r + "," + c];
    if(el) el.focus({preventScroll: false});
  }
  function onCellKeyDown(e){
    var r = +e.currentTarget.dataset.r, c = +e.currentTarget.dataset.c;
    if(e.key === "Enter" || e.key === " "){
      e.preventDefault();
      handleTap(r, c);

    else if(e.key === "ArrowLeft"){ e.preventDefault(); focusCell(r, c - 1); }

    gridEl.setAttribute("aria-label", "Word search grid, " + puzzle.rows + " rows by " + puzzle.cols + " columns");
    cellEls = {};
    for(var r = 0; r < puzzle.rows; r++){
      for(var c = 0; c < puzzle.cols; c++){

        d.className = "cell" + (c === puzzle.cols - 1 ? " last-col" : "") + (r === puzzle.rows - 1 ? " last-row" : "");

        gridEl.appendChild(d);
      }
    }
  }

  function buildWordList(){
    var ul = document.getElementById("wordList");
    ul.innerHTML = "";
    var sorted = puzzle.words.slice().sort(function(a, b){
      return a.word < b.word ? -1 : (a.word > b.word ? 1 : 0);

    sorted.forEach(function(w){
      var li = document.createElement("li");

    currentIndex = ((index % TOTAL) + TOTAL) % TOTAL;
    puzzle = window.WordSearchLibrary.getPuzzle(currentIndex);
    found = {};
    anchor = null; dragging = false; dragMoved = false;
    dragCells = null; dragStart = null;
    buildGrid();

    document.getElementById("puzzleCounter").textContent = "Puzzle " + (currentIndex + 1) + " of " + TOTAL;
    document.getElementById("puzzleTitleNum").textContent = "#" + (currentIndex + 1);

    document.getElementById("wordsTotal").textContent = puzzle.words.length;

    document.getElementById("congratsText").innerHTML =
      currentIndex < TOTAL - 1
        ? "Puzzle complete — every word found.<br>Ready for Puzzle " + (currentIndex + 2) + "?"
        : "Puzzle complete — that's all 100!<br>Encore? Head back to Puzzle 1.";
    document.getElementById("congrats").classList.remove("show");
    setFeedback("", "");
    updateProgress();
    if(scrollToBoard) boardCard.scrollIntoView({block: "start"});
    if(focusFirst){
      var first = cellEls["0,0"];
      if(first) first.focus({preventScroll: false});
    }
  }

  gridEl.addEventListener("pointermove", onGridPointerMove);
  gridEl.addEventListener("pointerup", onGridPointerUp);
  gridEl.addEventListener("pointercancel", onGridPointerCancel);

  /* Puzzle navigation */
  pickerEl.addEventListener("change", function(){ loadPuzzle(+pickerEl.value, true, true); });
  document.getElementById("shuffleBtn").addEventListener("click", function(){
    var n = currentIndex;
    while(n === currentIndex) n = Math.floor(Math.random() * TOTAL);
    loadPuzzle(n, true, true);

  document.getElementById("nextPuzzleCongratsBtn").addEventListener("click", function(){ loadPuzzle(currentIndex + 1, true, true); });

  document.getElementById("revealBtn").addEventListener("click", function(){ revealAll(); });
  document.getElementById("clearBtn").addEventListener("click", function(){ clearFound(); });
  document.getElementById("againBtn").addEventListener("click", function(){
    loadPuzzle(currentIndex, true, true);
  });

  loadPuzzle(0, false, false);
})();

var CATS = ["All","On Stage","Backstage","In the Studio","On the Road","Fan Life"];
var state = { cat:"All", query:"", story:null, values:[] };

var $ = function(id){ return document.getElementById(id); };
function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.remove("hidden"); setTimeout(function(){ t.classList.add("hidden"); },2600); }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function renderFilters(){
  var f=$("filters"); f.innerHTML="";
  CATS.forEach(function(c){
    var n = c==="All" ? STORIES.length : STORIES.filter(function(s){return s.cat===c;}).length;
    var b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent=c+" ("+n+")";
    b.setAttribute("aria-pressed", state.cat===c ? "true":"false");
    b.addEventListener("click",function(){ state.cat=c; renderFilters(); renderGrid(); });
    f.appendChild(b);
  });
}
function renderGrid(){
  var q=state.query.trim().toLowerCase();
  var list=STORIES.filter(function(s){
    var okCat = state.cat==="All" || s.cat===state.cat;
    var okQ = !q || (s.title+" "+s.teaser+" "+s.cat).toLowerCase().indexOf(q)>-1;
    return okCat && okQ;
  });
  var g=$("grid"); g.innerHTML="";
  list.forEach(function(s){
    var card=document.createElement("button"); card.type="button"; card.className="card";
    card.innerHTML='<span class="num">No. '+String(s.id).padStart(2,"0")+' &bull; '+s.blanks.length+' blanks</span><h3>'+esc(s.title)+'</h3><p>'+esc(s.teaser)+'</p><span class="meta"><span class="cat">'+esc(s.cat)+'</span><span>Play &rarr;</span></span>';
    card.addEventListener("click",function(){ openStory(s.id); });
    g.appendChild(card);
  });
  $("emptyState").classList.toggle("hidden", list.length>0);
  $("heroCount").textContent = STORIES.length+" STORIES \u2022 "+STORIES.reduce(function(a,s){return a+s.blanks.length;},0)+" BLANKS \u2022 ENDLESS REMIXES";
}
function show(view){
  $("libraryView").classList.toggle("hidden", view!=="library");
  $("fillView").classList.toggle("hidden", view!=="fill");
  $("storyView").classList.toggle("hidden", view!=="story");
  window.scrollTo({top:0,behavior:"smooth"});
}
function openStory(id){
  state.story = STORIES.find(function(s){return s.id===id;});
  state.values = state.story.blanks.map(function(){return "";});
  renderForm(); show("fill");
}
function renderForm(){
  var s=state.story;
  $("fillCat").textContent = s.cat+" \u2022 Story No. "+String(s.id).padStart(2,"0");
  $("fillTitle").textContent = s.title;
  $("fillSub").textContent = s.teaser+" Fill in every blank — the sillier, the better. No peeking at the story first!";
  var fields=$("fields"); fields.innerHTML="";
  s.blanks.forEach(function(b,i){
    var d=document.createElement("div"); d.className="field";
    d.innerHTML='<label for="f'+i+'"><span>'+(i+1)+'.</span> '+esc(b.label)+'</label><input id="f'+i+'" data-i="'+i+'" type="text" autocomplete="off" placeholder="Type a word\u2026" value="'+esc(state.values[i]||"")+'">'+(b.hint?'<div class="hint">'+esc(b.hint)+'</div>':'');
    fields.appendChild(d);
  });
  fields.querySelectorAll("input").forEach(function(inp){
    inp.addEventListener("input",function(){ state.values[+inp.dataset.i]=inp.value; updateProgress(); });
  });
  updateProgress();
}
function updateProgress(){
  var total=state.story.blanks.length;
  var done=state.values.filter(function(v){return v.trim();}).length;
  $("progBar").style.width = Math.round(done/total*100)+"%";
  $("progText").textContent = done+" of "+total+" blanks filled"+(done===total?" — you're ready to reveal!":"");
}
function collectFromInputs(){
  document.querySelectorAll("#fields input").forEach(function(inp){ state.values[+inp.dataset.i]=inp.value; });
}
function autoFill(onlyEmpty){
  collectFromInputs();
  state.story.blanks.forEach(function(b,i){
    if(!onlyEmpty || !state.values[i].trim()) state.values[i]=randFrom(bankFor(b.type));
  });
  renderForm(); toast(onlyEmpty?"Empty blanks filled for you — edit any you like!":"All blanks filled — hit Reveal when ready!");
}
function reveal(){
  collectFromInputs();
  var missing = state.values.map(function(v,i){return v.trim()?null:i;}).filter(function(x){return x!==null;});
  if(missing.length){ autoFill(true); }
  var s=state.story;
  var html = s.template.replace(/\[(\d+)\]/g,function(m,n){ return "<mark>"+esc(state.values[+n]||"")+"</mark>"; });
  $("storyCat").textContent = s.cat+" \u2022 Story No. "+String(s.id).padStart(2,"0");
  $("storyTitle").textContent = s.title;
  $("storyText").innerHTML = html;
  show("story");
}
function plainStory(){
  var s=state.story;
  return s.title+String.fromCharCode(10,10)+s.template.replace(/\[(\d+)\]/g,function(m,n){ return state.values[+n]||""; });
}

$("searchInput").addEventListener("input",function(e){ state.query=e.target.value; renderGrid(); });
$("randomBtn").addEventListener("click",function(){ openStory(randFrom(STORIES).id); });
$("revealBtn").addEventListener("click",reveal);
$("autoBtn").addEventListener("click",function(){ autoFill(false); });
$("clearBtn").addEventListener("click",function(){ state.values=state.story.blanks.map(function(){return "";}); renderForm(); });
$("backBtn1").addEventListener("click",function(){ show("library"); });
$("againBtn").addEventListener("click",function(){ state.values=state.story.blanks.map(function(){return "";}); renderForm(); show("fill"); });
$("anotherBtn").addEventListener("click",function(){ show("library"); });
$("editBtn").addEventListener("click",function(){ renderForm(); show("fill"); });
$("copyBtn").addEventListener("click",function(){
  var txt=plainStory();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){ toast("Story copied — paste it anywhere!"); },function(){ toast("Copy blocked here — use Download instead."); }); }
  else toast("Copy isn't available here — use Download instead.");
});
$("downloadBtn").addEventListener("click",function(){
  var blob=new Blob([plainStory()],{type:"text/plain"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=state.story.title.toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-mad-lib.txt";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
  toast("Story downloaded as a .txt file.");
});

renderFilters(); renderGrid();

};
</script>

<script>
window.__games = window.__games || {};
window.__games["jigsaw"] = function (document, window) {

var DIFFS = {
  easy:   {cols:3, rows:3, label:"Easy"},
  medium: {cols:4, rows:4, label:"Medium"},
  hard:   {cols:5, rows:4, label:"Hard"}
};
function makePieces(cols, rows){
  var pieces = [], id = 0, r, c;
  for(r = 0; r < rows; r++){
    for(c = 0; c < cols; c++){
      pieces.push({id:id++, col:c, row:r});
    }
  }
  return pieces;
}
function cellRect(col, row, pw, ph, boardX, boardY){
  return {x: boardX + col * pw, y: boardY + row * ph, w: pw, h: ph};
}
function snapCheck(cx, cy, rect, tol){
  return cx >= rect.x - tol && cx <= rect.x + rect.w + tol &&
         cy >= rect.y - tol && cy <= rect.y + rect.h + tol;
}
function shuffled(arr, rand){
  var a = arr.slice(), i, j, t;
  rand = rand || Math.random;
  for(i = a.length - 1; i > 0; i--){
    j = Math.floor(rand() * (i + 1));
    t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
(function(){
  "use strict";
  var PUZZLES = [
    {name:"Guitar, Microphone & Vinyl", url:"jigsaw/guitar-microphone-vinyl.webp"},
    {name:"Drum Kit", url:"jigsaw/drum-kit.webp"},
    {name:"Saxophone", url:"jigsaw/saxophone.webp"},
    {name:"Concert Crowd", url:"jigsaw/concert-crowd.webp"},
    {name:"Turntable", url:"jigsaw/turntable.webp"},
    {name:"Grand Piano", url:"jigsaw/grand-piano.webp"},
    {name:"Vintage Microphone", url:"jigsaw/vintage-microphone.webp"},
    {name:"Acoustic Guitar", url:"jigsaw/acoustic-guitar.webp"},
    {name:"Music Festival", url:"jigsaw/music-festival.webp"},
    {name:"Boombox", url:"jigsaw/boombox.webp"},
    {name:"Violin", url:"jigsaw/violin.webp"},
    {name:"Band on Stage", url:"jigsaw/band-on-stage.webp"},
    {name:"Headphones", url:"jigsaw/headphones.webp"},
    {name:"Mixing Console", url:"jigsaw/mixing-console.webp"},
    {name:"Tambourine", url:"jigsaw/tambourine.webp"},
    {name:"Trumpet", url:"jigsaw/trumpet.webp"},
    {name:"Vinyl Closeup", url:"jigsaw/vinyl-closeup.webp"},
    {name:"Singer with Microphone", url:"jigsaw/singer-with-microphone.webp"},
    {name:"Dressing Room", url:"jigsaw/dressing-room.webp"},
    {name:"Cassettes & Walkman", url:"jigsaw/cassettes-walkman.webp"}
  ];
  var TOTAL = PUZZLES.length;
  var TRAY_SCALE = 0.55;
  var TRAY_GAP = 8;
  var SNAP_TOL = 22;
  var currentPuzzle = 0;
  var currentDiff = "easy";
  var cols = 3, rows = 3;
  var pieces = [];
  var placedCount = 0;
  var selectedPiece = null;
  var drag = null;
  var completed = {};
  var playArea = document.getElementById("playArea");
  var board = document.getElementById("board");
  var slotsEl = document.getElementById("slots");
  var tray = document.getElementById("tray");
  var progressEl = document.getElementById("piecesDone");
  var totalEl = document.getElementById("piecesTotal");
  var feedbackEl = document.getElementById("feedback");
  var congratsEl = document.getElementById("congrats");
  var puzzleCounterEl = document.getElementById("puzzleCounter");
  var puzzlePickerEl = document.getElementById("puzzlePicker");
  var puzzleTitleNumEl = document.getElementById("puzzleTitleNum");
  var puzzleTitleEl = document.getElementById("puzzleTitle");
  var diffBtns = {
    easy: document.getElementById("easyBtn"),
    medium: document.getElementById("mediumBtn"),
    hard: document.getElementById("hardBtn")
  };
  for(var pi = 0; pi < TOTAL; pi++){
    var opt = document.createElement("option");
    opt.value = pi;
    opt.textContent = (pi + 1) + ". " + PUZZLES[pi].name;
    puzzlePickerEl.appendChild(opt);
  }
  function refreshPicker(){
    for(var i = 0; i < TOTAL; i++){
      puzzlePickerEl.options[i].textContent = (i + 1) + ". " + PUZZLES[i].name + (completed[i] ? " \u2713" : "");
    }
  }
  function boardMetrics(){
    var pr = playArea.getBoundingClientRect();
    var br = board.getBoundingClientRect();
    var tr = tray.getBoundingClientRect();
    var bBorderX = (br.width - board.clientWidth) / 2;
    var bBorderY = (br.height - board.clientHeight) / 2;
    var tBorderX = (tr.width - tray.clientWidth) / 2;
    var tBorderY = (tr.height - tray.clientHeight) / 2;
    return {
      playW: pr.width, playH: pr.height,
      boardX: (br.left - pr.left) + bBorderX,
      boardY: (br.top - pr.top) + bBorderY,
      boardW: board.clientWidth, boardH: board.clientHeight,
      pw: board.clientWidth / cols, ph: board.clientHeight / rows,
      trayX: (tr.left - pr.left) + tBorderX,
      trayY: (tr.top - pr.top) + tBorderY,
      trayW: tray.clientWidth, trayH: tray.clientHeight
    };
  }
  function trayLayout(m){
    var slotW = m.pw * TRAY_SCALE, slotH = m.ph * TRAY_SCALE;
    var contentW = m.trayW - 16;
    var perRow = Math.max(1, Math.floor((contentW + TRAY_GAP) / (slotW + TRAY_GAP)));
    var rowsNeeded = Math.ceil(pieces.length / perRow);
    var contentH = rowsNeeded * slotH + (rowsNeeded - 1) * TRAY_GAP + 16;
    return {slotW: slotW, slotH: slotH, perRow: perRow, rowsNeeded: rowsNeeded, contentH: contentH};
  }
  function traySlot(index, m, tl){
    var r = Math.floor(index / tl.perRow), c = index % tl.perRow;
    return {
      x: m.trayX + 8 + c * (tl.slotW + TRAY_GAP),
      y: m.trayY + 8 + r * (tl.slotH + TRAY_GAP)
    };
  }
  function layout(){
    var m = boardMetrics();
    var tl = trayLayout(m);
    tray.style.height = (tl.contentH + 6) + "px";
    m = boardMetrics();
    tl = trayLayout(m);
    pieces.forEach(function(p){
      p.el.style.width = m.pw + "px";
      p.el.style.height = m.ph + "px";
      if(p.placed){
        p.el.style.left = (m.boardX + p.col * m.pw) + "px";
        p.el.style.top = (m.boardY + p.row * m.ph) + "px";
        p.el.style.transform = "scale(1)";
        p.el.style.zIndex = 2;
        p.scale = 1;
      } else {
        var pos = traySlot(p.trayIndex, m, tl);
        p.el.style.left = pos.x + "px";
        p.el.style.top = pos.y + "px";
        p.el.style.transform = "scale(" + TRAY_SCALE + ")";
        p.el.style.zIndex = 5;
        p.scale = TRAY_SCALE;
      }
    });
  }
  function build(diffKey){
    currentDiff = diffKey;
    var d = DIFFS[diffKey];
    cols = d.cols; rows = d.rows;
    placedCount = 0;
    selectedPiece = null;
    drag = null;
    congratsEl.classList.remove("show");
    setFeedback("");
    pieces.forEach(function(p){
      if(p.el && p.el.parentNode) p.el.parentNode.removeChild(p.el);
    });
    pieces = [];
    slotsEl.innerHTML = "";
    slotsEl.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
    slotsEl.style.gridTemplateRows = "repeat(" + rows + ", 1fr)";
    var total = cols * rows, i;
    for(i = 0; i < total; i++){
      var s = document.createElement("div");
      s.className = "slot";
      slotsEl.appendChild(s);
    }
    var defs = shuffled(makePieces(cols, rows));
    defs.forEach(function(def, trayIndex){
      var el = document.createElement("div");
      el.className = "piece";
      el.tabIndex = 0;
      el.setAttribute("role", "button");
      el.setAttribute("aria-label", "Puzzle piece " + (trayIndex + 1) + " of " + total);
      el.style.backgroundSize = (cols * 100) + "% " + (rows * 100) + "%";
      el.style.backgroundPosition =
        (cols > 1 ? (def.col / (cols - 1) * 100) : 0) + "% " +
        (rows > 1 ? (def.row / (rows - 1) * 100) : 0) + "%";
      playArea.appendChild(el);
      var p = {id:def.id, col:def.col, row:def.row, el:el, placed:false, trayIndex:trayIndex, scale:TRAY_SCALE};
      pieces.push(p);
      attachPiece(el, p);
    });
    totalEl.textContent = total;
    updateProgress();
    updateDiffButtons();
    layout();
  }
  function updateDiffButtons(){
    Object.keys(diffBtns).forEach(function(key){
      diffBtns[key].classList.toggle("primary", key === currentDiff);
    });
  }
  function updateProgress(){
    progressEl.textContent = placedCount;
    totalEl.textContent = pieces.length;
  }
  function setFeedback(msg, kind){
    feedbackEl.textContent = msg || "";
    feedbackEl.className = "feedback" + (kind ? " " + kind : "");
  }
  function placePiece(p, m){
    m = m || boardMetrics();
    var el = p.el;
    el.style.left = (m.boardX + p.col * m.pw) + "px";
    el.style.top = (m.boardY + p.row * m.ph) + "px";
    el.style.transform = "scale(1)";
    el.style.zIndex = 2;
    p.scale = 1;
    p.placed = true;
    el.classList.add("placed");
    el.classList.remove("selected");
    el.setAttribute("aria-label", "Puzzle piece placed");
    placedCount++;
    updateProgress();
    setFeedback("");
    if(placedCount === pieces.length){
      if(!completed[currentPuzzle]){ completed[currentPuzzle] = true; refreshPicker(); }
      congratsEl.classList.add("show");
      setFeedback("Puzzle complete — nice work!", "good");
    }
  }
  function returnToTray(p, m){
    m = m || boardMetrics();
    var tl = trayLayout(m);
    var pos = traySlot(p.trayIndex, m, tl);
    var el = p.el;
    el.style.left = pos.x + "px";
    el.style.top = pos.y + "px";
    el.style.transform = "scale(" + TRAY_SCALE + ")";
    el.style.zIndex = 5;
    p.scale = TRAY_SCALE;
    el.classList.remove("selected");
  }
  function tryPlace(p){
    var m = boardMetrics();
    var el = p.el;
    var left = parseFloat(el.style.left) || 0;
    var top = parseFloat(el.style.top) || 0;
    var cx = left + m.pw / 2, cy = top + m.ph / 2;
    var rect = cellRect(p.col, p.row, m.pw, m.ph, m.boardX, m.boardY);
    if(snapCheck(cx, cy, rect, SNAP_TOL)){
      placePiece(p, m);
    } else {
      returnToTray(p, m);
    }
    deselectPiece();
  }
  function deselectPiece(){
    if(selectedPiece){
      selectedPiece.el.classList.remove("selected");
      selectedPiece = null;
    }
  }
  function attachPiece(el, p){
    el.addEventListener("pointerdown", function(e){
      if(p.placed) return;
      e.preventDefault();
      startDrag(p, e);
    });
    el.addEventListener("keydown", function(e){
      if(p.placed) return;
      if(e.key === "Enter" || e.key === " "){
        e.preventDefault();
        toggleKeyboardSelect(p);
      } else if(selectedPiece === p && e.key.indexOf("Arrow") === 0){
        e.preventDefault();
        moveSelected(e.key);
      } else if(e.key === "Escape" && selectedPiece === p){
        e.preventDefault();
        returnToTray(p);
        deselectPiece();
      }
    });
  }
  function startDrag(p, e){
    var m = boardMetrics();
    var el = p.el;
    var rect = el.getBoundingClientRect();
    var pr = playArea.getBoundingClientRect();
    var fx = rect.width ? (e.clientX - rect.left) / rect.width : 0.5;
    var fy = rect.height ? (e.clientY - rect.top) / rect.height : 0.5;
    var offsetX = fx * m.pw, offsetY = fy * m.ph;
    var px = e.clientX - pr.left, py = e.clientY - pr.top;
    el.style.transform = "scale(1)";
    p.scale = 1;
    el.style.left = (px - offsetX) + "px";
    el.style.top = (py - offsetY) + "px";
    el.classList.add("dragging");
    el.style.zIndex = 30;
    deselectPiece();
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    drag = {p:p, offsetX:offsetX, offsetY:offsetY, playRect:pr};
    el.addEventListener("pointermove", onDragMove);
    el.addEventListener("pointerup", onDragEnd, {once:true});
    el.addEventListener("pointercancel", onDragEnd, {once:true});
  }
  function onDragMove(e){
    if(!drag) return;
    var pr = drag.playRect;
    var px = e.clientX - pr.left, py = e.clientY - pr.top;
    var el = drag.p.el;
    el.style.left = (px - drag.offsetX) + "px";
    el.style.top = (py - drag.offsetY) + "px";
  }
  function onDragEnd(e){
    if(!drag) return;
    var p = drag.p;
    drag = null;
    p.el.classList.remove("dragging");
    p.el.removeEventListener("pointermove", onDragMove);
    tryPlace(p);
  }
  function toggleKeyboardSelect(p){
    if(selectedPiece === p){
      tryPlace(p);
      return;
    }
    if(selectedPiece){
      returnToTray(selectedPiece);
      deselectPiece();
    }
    var m = boardMetrics();
    selectedPiece = p;
    var el = p.el;
    el.classList.add("selected");
    el.style.transform = "scale(1)";
    p.scale = 1;
    el.style.zIndex = 30;
    el.style.left = (m.boardX + (m.boardW - m.pw) / 2) + "px";
    el.style.top = (m.boardY + (m.boardH - m.ph) / 2) + "px";
    el.focus();
    setFeedback("Piece lifted — use the arrow keys to move it, Enter to drop it, Escape to put it back.");
  }
  function moveSelected(key){
    var p = selectedPiece;
    if(!p) return;
    var step = 24;
    var el = p.el;
    var left = parseFloat(el.style.left) || 0;
    var top = parseFloat(el.style.top) || 0;
    if(key === "ArrowLeft") left -= step;
    else if(key === "ArrowRight") left += step;
    else if(key === "ArrowUp") top -= step;
    else if(key === "ArrowDown") top += step;
    var m = boardMetrics();
    left = Math.max(0, Math.min(left, m.playW - m.pw));
    top = Math.max(0, Math.min(top, m.playH - m.ph));
    el.style.left = left + "px";
    el.style.top = top + "px";
  }
  function loadPuzzle(index){
    currentPuzzle = ((index % TOTAL) + TOTAL) % TOTAL;
    var puzzle = PUZZLES[currentPuzzle];
    puzzleCounterEl.textContent = "Puzzle " + (currentPuzzle + 1) + " of " + TOTAL;
    puzzleTitleNumEl.textContent = "#" + (currentPuzzle + 1);
    puzzleTitleEl.textContent = puzzle.name;
    puzzlePickerEl.value = String(currentPuzzle);
    document.getElementById("nextPuzzleCongratsBtn").innerHTML =
      currentPuzzle < TOTAL - 1 ? "Next Puzzle &rarr;" : "Back to Puzzle 1 &rarr;";
    document.getElementById("congratsText").innerHTML =
      currentPuzzle < TOTAL - 1
        ? "Puzzle complete — every piece in place.<br>Ready for Puzzle " + (currentPuzzle + 2) + "?"
        : "Puzzle complete — that's all 20!<br>Encore? Head back to Puzzle 1.";
    setFeedback("Loading picture…");
    var img = new Image();
    img.onload = function(){
      document.documentElement.style.setProperty("--puzzle-img", 'url("' + puzzle.url + '")');
      build(currentDiff);
    };
    img.onerror = function(){
      setFeedback("That picture didn't load — try another puzzle.", "bad");
    };
    img.src = puzzle.url;
  }
  Object.keys(diffBtns).forEach(function(key){
    diffBtns[key].addEventListener("click", function(){ build(key); });
  });
  document.getElementById("shuffleBtn").addEventListener("click", function(){
    var n = currentPuzzle;
    while(n === currentPuzzle) n = Math.floor(Math.random() * TOTAL);
    loadPuzzle(n);
  });
  document.getElementById("prevPuzzleBtn").addEventListener("click", function(){ loadPuzzle(currentPuzzle - 1); });
  document.getElementById("nextPuzzleBtn").addEventListener("click", function(){ loadPuzzle(currentPuzzle + 1); });
  document.getElementById("nextPuzzleCongratsBtn").addEventListener("click", function(){ loadPuzzle(currentPuzzle + 1); });
  puzzlePickerEl.addEventListener("change", function(){ loadPuzzle(+puzzlePickerEl.value); });
  document.getElementById("againBtn").addEventListener("click", function(){ build(currentDiff); });
  var resizeTimer = null;
  window.addEventListener("resize", function(){
    if(resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){ layout(); }, 120);
  });
  loadPuzzle(0);
})();

};
</script>

        var sceneEl = document.getElementById("scene");
        var sceneImg = document.getElementById("sceneImg");
        var hotspotsEl = document.getElementById("hotspots");
        var sceneTitle = document.getElementById("sceneTitle");
        var checklist = document.getElementById("checklist");
        var checklistSub = document.getElementById("checklistSub");
        var foundCountEl = document.getElementById("foundCount");
        var progressBar = document.getElementById("progressBar");
        var toast = document.getElementById("toast");
        var win = document.getElementById("win");
        var winBurst = document.getElementById("winBurst");
        var winTitle = document.getElementById("winTitle");
        var winText = document.getElementById("winText");
        var nextSceneBtn = document.getElementById("nextSceneBtn");
        var hintBtn = document.getElementById("hintBtn");
        var resetBtn = document.getElementById("resetBtn");
        var playAgainBtn = document.getElementById("playAgainBtn");
        var hintNote = document.getElementById("hintNote");
        var pickerGrid = document.getElementById("pickerGrid");
        var overallProgress = document.getElementById("overallProgress");

        // Per-scene progress: each scene remembers its own found items.
        var sceneFound = SCENES.map(function () { return {}; });
        var sceneTotals = SCENES.map(function () { return 0; });
        var current = 0;
        var toastTimer = null;
        var hintTimer = null;

        // ---------- Scene picker ----------
        var pickerBtns = [];
        SCENES.forEach(function (sc, idx) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "scene-btn";
          var num = document.createElement("span");
          num.className = "num";
          num.textContent = sc.number;
          var meta = document.createElement("span");
          meta.className = "meta";
          var sname = document.createElement("span");
          sname.className = "sname";
          sname.textContent = sc.name;
          var scount = document.createElement("span");
          scount.className = "scount";
          scount.textContent = "0 / 10 found";
          meta.appendChild(sname);
          meta.appendChild(scount);
          btn.appendChild(num);
          btn.appendChild(meta);
          btn.addEventListener("click", function () { loadScene(idx); });
          pickerGrid.appendChild(btn);
          pickerBtns.push({ btn: btn, num: num, scount: scount });
        });

        function refreshPicker() {
          var cleared = 0;
          SCENES.forEach(function (sc, idx) {
            var p = pickerBtns[idx];
            var total = sceneTotals[idx];
            var done = total >= sc.items.length;
            if (done) cleared++;
            p.btn.classList.toggle("active", idx === current);
            p.btn.classList.toggle("cleared", done);
            p.num.textContent = done ? "✓" : sc.number;
            p.scount.textContent = done ? "Cleared!" : total + " / " + sc.items.length + " found";
            p.btn.setAttribute(
              "aria-label",
              "Scene " + sc.number + ": " + sc.name + " — " + total + " of " + sc.items.length + " found" + (done ? ", cleared" : "")
            );
          });
          overallProgress.textContent = cleared + " of " + SCENES.length + " scenes cleared";
        }

        // ---------- Scene loading ----------
        function loadScene(idx) {
          current = idx;
          var sc = SCENES[idx];
          if (hintTimer) clearTimeout(hintTimer);
          win.classList.remove("show");
          hintNote.textContent = "";
          hintBtn.disabled = sceneTotals[idx] >= sc.items.length;

          sceneTitle.innerHTML = "";
          var no = document.createElement("span");
          no.className = "no";
          no.textContent = "Scene " + sc.number + " · ";
          sceneTitle.appendChild(no);
          sceneTitle.appendChild(document.createTextNode(sc.name));

          // Lazy: the image file is only fetched when its scene is opened.
          sceneImg.src = sc.image;
          sceneImg.alt = "Pop-art illustration: " + sc.name + " — a concert scene with ten hidden items to find.";
          checklistSub.textContent = "Scene " + sc.number + " — " + sc.name + ". Find all ten to clear this scene.";

          buildScene();
          refreshPicker();
          updateCounter();
        }

        function buildScene() {
          var sc = SCENES[current];
          var foundMap = sceneFound[current];
          hotspotsEl.innerHTML = "";
          checklist.innerHTML = "";

          sc.items.forEach(function (item) {
            var isFound = !!foundMap[item.id];

            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "hotspot" + (isFound ? " found" : "");
            btn.id = "spot-" + item.id;
            btn.style.left = item.x + "%";
            btn.style.top = item.y + "%";
            btn.setAttribute("aria-label", isFound ? item.name + " — found" : "Hidden item: " + item.name);
            var ring = document.createElement("span");
            ring.className = "ring";
            ring.setAttribute("aria-hidden", "true");
            btn.appendChild(ring);
            btn.addEventListener("click", function (ev) {
              ev.stopPropagation();
              findItem(item, btn);
            });
            hotspotsEl.appendChild(btn);

            var li = document.createElement("li");
            li.id = "row-" + item.id;
            if (isFound) li.className = "done";
            var box = document.createElement("span");
            box.className = "box";
            box.setAttribute("aria-hidden", "true");
            box.textContent = isFound ? "✓" : "";
            var textWrap = document.createElement("span");
            var name = document.createElement("span");
            name.className = "name";
            name.textContent = item.name;
            var where = document.createElement("span");
            where.className = "where";
            where.textContent = item.where;
            textWrap.appendChild(name);
            textWrap.appendChild(where);
            li.appendChild(box);
            li.appendChild(textWrap);
            checklist.appendChild(li);
          });
        }

        function showToast(msg) {
          toast.textContent = msg;
          toast.classList.add("show");
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2200);
        }

        function updateCounter() {
          foundCountEl.textContent = sceneTotals[current];
          progressBar.style.width = (sceneTotals[current] * 10) + "%";
        }

        function findItem(item, btn) {
          if (sceneFound[current][item.id]) return;
          sceneFound[current][item.id] = true;
          sceneTotals[current]++;
          btn.classList.remove("hinting");
          btn.classList.add("found");
          btn.setAttribute("aria-label", item.name + " — found");
          var row = document.getElementById("row-" + item.id);
          row.classList.add("done");
          row.querySelector(".box").textContent = "✓";
          updateCounter();
          refreshPicker();
          var sc = SCENES[current];
          if (sceneTotals[current] >= sc.items.length) {
            showToast("That's everything — scene " + sc.number + " cleared!");
            setTimeout(showWin, 650);
            hintBtn.disabled = true;
          } else {
            showToast("Found it — the " + item.name.toLowerCase() + "!");
          }
        }

        function showWin() {
          var sc = SCENES[current];
          var cleared = sceneTotals.filter(function (t, i) { return t >= SCENES[i].items.length; }).length;
          var isLast = current >= SCENES.length - 1;
          winBurst.textContent = "Scene " + sc.number + " cleared";
          if (cleared >= SCENES.length) {
            winTitle.textContent = "All 25 scenes cleared!";
            winText.textContent = "Every last bit of gear, in every last scene, accounted for. The road crew salutes you — see you at the next show.";
          } else {
            winTitle.textContent = "You found them all!";
            winText.textContent = "All ten hidden items in " + sc.name + " are accounted for. That's " + cleared + " of " + SCENES.length + " scenes cleared.";
          }
          nextSceneBtn.style.display = isLast ? "none" : "";
          nextSceneBtn.textContent = isLast ? "" : "Next scene: " + SCENES[current + 1].name;
          win.classList.add("show");
        }

        // Miss feedback: a soft ripple wherever the player taps empty stage.
        sceneEl.addEventListener("click", function (ev) {
          if (win.classList.contains("show")) return;
          if (ev.target !== sceneImg && ev.target !== hotspotsEl) return;
          var rect = sceneEl.getBoundingClientRect();
          var ripple = document.createElement("span");
          ripple.className = "miss";
          ripple.style.left = (ev.clientX - rect.left) + "px";
          ripple.style.top = (ev.clientY - rect.top) + "px";
          sceneEl.appendChild(ripple);
          setTimeout(function () { ripple.remove(); }, 500);
        });

        hintBtn.addEventListener("click", function () {
          var sc = SCENES[current];
          var remaining = sc.items.filter(function (i) { return !sceneFound[current][i.id]; });
          if (!remaining.length) return;
          var pick = remaining[Math.floor(Math.random() * remaining.length)];
          var btn = document.getElementById("spot-" + pick.id);
          // clear any previous hint first
          sc.items.forEach(function (i) {
            var b = document.getElementById("spot-" + i.id);
            if (b) b.classList.remove("hinting");
          });
          if (hintTimer) clearTimeout(hintTimer);
          // force reflow so the pulse animation restarts cleanly
          void btn.offsetWidth;
          btn.classList.add("hinting");
          hintNote.innerHTML = "Psst — keep an eye out <b>somewhere in the scene</b>. One item is glowing…";
          hintTimer = setTimeout(function () {
            btn.classList.remove("hinting");
          }, 2400);
        });

        function resetScene() {
          sceneFound[current] = {};
          sceneTotals[current] = 0;
          if (hintTimer) clearTimeout(hintTimer);
          win.classList.remove("show");
          hintBtn.disabled = false;
          hintNote.textContent = "";
          buildScene();
          refreshPicker();
          updateCounter();
          showToast("Fresh start — happy hunting!");
        }

        resetBtn.addEventListener("click", resetScene);
        playAgainBtn.addEventListener("click", resetScene);
        nextSceneBtn.addEventListener("click", function () {
          if (current < SCENES.length - 1) loadScene(current + 1);
        });

        loadScene(0);
      })();
    
};
</script>

var pickerView = document.getElementById('pickerView');
var gameView = document.getElementById('gameView');
var themeGrid = document.getElementById('themeGrid');
var tallyText = document.getElementById('tallyText');
var tallyBar = document.getElementById('tallyBar');
var boardEl = document.getElementById('board');
var gameTitle = document.getElementById('gameTitle');
var pairsStat = document.getElementById('pairsStat');
var movesStat = document.getElementById('movesStat');
var timeStat = document.getElementById('timeStat');
var winPanel = document.getElementById('winPanel');
var winText = document.getElementById('winText');
var winMoves = document.getElementById('winMoves');
var winTime = document.getElementById('winTime');
var boardHint = document.getElementById('boardHint');
var midActions = document.getElementById('midActions');

var cleared = {};
var currentTheme = null;
var firstCard = null;
var lockBoard = false;
var moves = 0;
var pairsFound = 0;
var timerId = null;
var startTime = 0;
var elapsed = 0;
var timerStarted = false;

function formatTime(totalSeconds){
  var m = Math.floor(totalSeconds / 60);
  var s = totalSeconds % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}
function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function renderPicker(){
  themeGrid.innerHTML = '';
  var count = 0;
  THEMES.forEach(function(theme, idx){
    var isCleared = !!cleared[theme.slug];
    if (isCleared) count++;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'theme-btn' + (isCleared ? ' is-cleared' : '');
    btn.setAttribute('aria-label', theme.name + (isCleared ? ', cleared' : '') + '. 8 pairs.');
    var num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(idx + 1).padStart(2, '0');
    var main = document.createElement('span');
    main.className = 'tname';
    main.textContent = theme.name;
    var sub = document.createElement('span');
    sub.className = 'tsub';
    sub.textContent = '8 pairs · 16 cards';
    main.appendChild(sub);
    var check = document.createElement('span');
    check.className = 'check';
    check.setAttribute('aria-hidden', 'true');
    check.textContent = '\u2713';
    btn.appendChild(num);
    btn.appendChild(main);
    btn.appendChild(check);
    btn.addEventListener('click', function(){ startGame(theme.slug); });
    themeGrid.appendChild(btn);
  });
  tallyText.textContent = count + ' of ' + THEMES.length;
  tallyBar.style.width = (THEMES.length ? (count / THEMES.length * 100) : 0) + '%';
}

function shuffle(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function stopTimer(){
  if (timerId){ clearInterval(timerId); timerId = null; }
}
function tick(){
  if (!timerStarted) return;
  elapsed = Math.floor((Date.now() - startTime) / 1000);
  timeStat.textContent = formatTime(elapsed);
}
function startTimer(){
  stopTimer();
  startTime = Date.now() - elapsed * 1000;
  timerId = setInterval(tick, 500);
}
function updateStats(){
  pairsStat.textContent = pairsFound + ' of 8';
  movesStat.textContent = String(moves);
  timeStat.textContent = formatTime(elapsed);
}

function startGame(slug){
  var theme = null;
  for (var i = 0; i < THEMES.length; i++){ if (THEMES[i].slug === slug){ theme = THEMES[i]; break; } }
  if (!theme) return;
  currentTheme = theme;
  firstCard = null;
  lockBoard = false;
  moves = 0;
  pairsFound = 0;
  elapsed = 0;
  timerStarted = false;
  stopTimer();

  gameTitle.textContent = theme.name;
  winPanel.classList.add('hidden');
  midActions.classList.remove('hidden');
  boardHint.textContent = 'Tap a card to flip it. Find its match.';
  updateStats();

  // Lazy-load only this theme's 8 images, now that it has been selected.
  theme.cards.forEach(function(src){ var im = new Image(); im.src = src; });

  var deck = [];
  theme.items.forEach(function(item, idx){
    deck.push({ pair: idx, item: item, src: theme.cards[idx] });
    deck.push({ pair: idx, item: item, src: theme.cards[idx] });
  });
  deck = shuffle(deck);

  boardEl.innerHTML = '';
  deck.forEach(function(cardData){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'card';
    btn.dataset.pair = String(cardData.pair);
    btn.setAttribute('aria-label', 'Face-down card');

    var inner = document.createElement('span');
    inner.className = 'card-inner';
    inner.style.display = 'block';

    var front = document.createElement('span');
    front.className = 'face front';
    var frontImg = document.createElement('img');
    frontImg.src = CARD_BACK;
    frontImg.alt = '';
    frontImg.draggable = false;
    front.appendChild(frontImg);

    var back = document.createElement('span');
    back.className = 'face back';
    var backImg = document.createElement('img');
    backImg.src = cardData.src;
    backImg.alt = cap(cardData.item);
    backImg.loading = 'lazy';
    backImg.decoding = 'async';
    backImg.draggable = false;
    var label = document.createElement('span');
    label.className = 'label';
    label.textContent = cap(cardData.item);
    back.appendChild(backImg);
    back.appendChild(label);

    inner.appendChild(front);
    inner.appendChild(back);
    btn.appendChild(inner);
    btn.addEventListener('click', function(){ onCardClick(btn, cardData); });
    boardEl.appendChild(btn);
  });

  pickerView.classList.add('hidden');
  gameView.classList.remove('hidden');
  window.scrollTo(0, 0);
}

function onCardClick(btn, cardData){
  if (lockBoard) return;
  if (btn.classList.contains('is-flipped') || btn.classList.contains('is-matched')) return;

  if (!timerStarted){
    timerStarted = true;
    startTimer();
  }
  tick();

  btn.classList.add('is-flipped');
  btn.setAttribute('aria-label', cap(cardData.item));

  if (!firstCard){
    firstCard = { btn: btn, data: cardData };
    return;
  }

  var first = firstCard;
  firstCard = null;
  moves++;
  updateStats();

  if (first.data.pair === cardData.pair){
    first.btn.classList.add('is-matched');
    btn.classList.add('is-matched');
    pairsFound++;
    updateStats();
    boardHint.textContent = pairsFound === 8 ? 'All pairs found!' : 'Match — ' + cap(cardData.item) + '! ' + (8 - pairsFound) + ' to go.';
    if (pairsFound === 8){
      stopTimer();
      elapsed = Math.floor((Date.now() - startTime) / 1000);
      if (!timerStarted) elapsed = 0;
      timeStat.textContent = formatTime(elapsed);
      cleared[currentTheme.slug] = true;
      renderPicker();
      winText.innerHTML = 'You cleared <strong>' + currentTheme.name + '</strong> — all 8 pairs found.';
      winMoves.textContent = String(moves);
      winTime.textContent = formatTime(elapsed);
      winPanel.classList.remove('hidden');
      midActions.classList.add('hidden');
      setTimeout(function(){ winPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 350);
    }
  } else {
    lockBoard = true;
    boardHint.textContent = 'Not a match — try to remember those two.';
    var a = first.btn, b = btn;
    var aLabel = cap(first.data.item), bLabel = cap(cardData.item);
    setTimeout(function(){
      a.classList.remove('is-flipped');
      b.classList.remove('is-flipped');
      a.setAttribute('aria-label', 'Face-down card');
      b.setAttribute('aria-label', 'Face-down card');
      lockBoard = false;
      boardHint.textContent = 'Tap a card to flip it. Find its match.';
      void aLabel; void bLabel;
    }, 950);
  }
}

function backToPicker(){
  stopTimer();
  gameView.classList.add('hidden');
  pickerView.classList.remove('hidden');
  renderPicker();
  window.scrollTo(0, 0);
}

document.getElementById('backBtn').addEventListener('click', backToPicker);
document.getElementById('winBackBtn').addEventListener('click', backToPicker);
document.getElementById('playAgainBtn').addEventListener('click', function(){ if (currentTheme) startGame(currentTheme.slug); });
document.getElementById('restartBtn').addEventListener('click', function(){ if (currentTheme) startGame(currentTheme.slug); });
document.getElementById('shuffleBtn').addEventListener('click', function(){ if (currentTheme) startGame(currentTheme.slug); });
document.getElementById('resetProgressBtn').addEventListener('click', function(){ cleared = {}; renderPicker(); });

renderPicker();

};
</script>
